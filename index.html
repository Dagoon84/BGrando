<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7c86">
  <title>Brettspiel-Randomizer</title>
  <script>try { const th = JSON.parse(localStorage.getItem("theme")); if (th) document.documentElement.dataset.theme = th; } catch {}</script>
  <style>
    :root { --bg: #f2f7fa; --card: #ffffff; --fg: #10202e; --muted: #5a6b7a; --border: #d6e1e9; --accent: #0e7c86; --accent-fg: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) { --bg: #0a141c; --card: #13212d; --fg: #e5edf3; --muted: #93a5b4; --border: #24384a; --accent: #3bbfc8; --accent-fg: #062026; }
    }
    :root[data-theme="dark"] { --bg: #0a141c; --card: #13212d; --fg: #e5edf3; --muted: #93a5b4; --border: #24384a; --accent: #3bbfc8; --accent-fg: #062026; }
    :root[data-theme="contrast"] { --bg: #000; --card: #000; --fg: #fff; --muted: #e6e6e6; --border: #fff; --accent: #ffe600; --accent-fg: #000; --accent-soft: #333; --hot: #ffe600; --coral: #ffe600; --t-coral: #4d1f14; --t-fish: #102a55; --t-mix: #35215c; }
    :root[data-theme="contrast"] .roll { color: #000; }
    :root[data-theme="contrast"] .toggle input:not(:checked) { background: #666; }
    :root[data-theme="rainbow"] { --bg: #fff8fc; --card: rgba(255,255,255,.88); --fg: #2b1a33; --muted: #6b5a73; --border: #ecd9ee; --accent: #8a3ffc; --accent-fg: #fff; --accent-soft: #f1e6ff; --hot: #ff4f9a; --coral: #ff4f9a; --t-coral: #ffe0d9; --t-fish: #dbe9ff; --t-mix: #eadfff; --rainbow: linear-gradient(90deg, #ff5f6d, #ffa63d, #ffd93d, #4cd17a, #3fa7ff, #9b5cff); }
    :root[data-theme="rainbow"] body { background: linear-gradient(160deg, #ffe1e6, #fff1d6, #e2fbe6, #dff0ff, #efe2ff) fixed; }
    :root[data-theme="rainbow"] .roll,
    :root[data-theme="rainbow"] [aria-pressed="true"] { background: var(--rainbow); border-color: transparent; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    main { max-width: 640px; margin: 0 auto; }
    header { display: flex; justify-content: flex-end; }
    .lang { display: flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--card); }
    .lang button { min-width: 48px; min-height: 44px; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; }
    .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
    h1 { font-size: 1.75rem; margin: 8px 0 4px; line-height: 1.2; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .games { display: grid; gap: 12px; }
    .game {
      display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 14px 16px;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px; color: var(--fg); text-decoration: none;
    }
    .game:active { transform: scale(.99); }
    .game .icon { font-size: 2.6rem; line-height: 1; width: 48px; text-align: center; flex: none; color: inherit; }
    .game strong { display: block; font-size: 1.1rem; }
    .game span { color: var(--muted); font-size: .9rem; }
    .theme { margin-top: 24px; }
    .theme h2 { font-size: 1rem; margin: 0 0 8px; color: var(--muted); }
    .seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .seg button {
      min-height: 48px; border: 1px solid var(--border); border-radius: 12px; background: var(--card);
      color: var(--fg); font: inherit; font-weight: 600;
    }
    .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  </style>
</head>
<body>
<main>
  <header>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>
  <h1 data-i18n="title">Brettspiel-Randomizer</h1>
  <p class="sub" data-i18n="subtitle">Zufallshelfer für den Spielaufbau</p>
  <nav class="games" id="games"></nav>
  <section class="theme">
    <h2 data-i18n="theme">Darstellung</h2>
    <div class="seg" id="theme">
      <button type="button" data-theme-value="light" data-i18n="light">☀️ Hell</button>
      <button type="button" data-theme-value="dark" data-i18n="dark">🌙 Dunkel</button>
      <button type="button" data-theme-value="contrast" data-i18n="contrast">◐ Kontrast</button>
      <button type="button" data-theme-value="rainbow" data-i18n="rainbow">🌈 Regenbogen</button>
    </div>
  </section>
</main>
<script>
const I18N = {
  de: { docTitle: "Brettspiel-Randomizer", title: "Brettspiel-Randomizer", subtitle: "Zufallshelfer für den Spielaufbau",
        theme: "Darstellung", light: "☀️ Hell", dark: "🌙 Dunkel", contrast: "◐ Kontrast", rainbow: "🌈 Regenbogen" },
  en: { docTitle: "Board Game Randomizers", title: "Board Game Randomizers", subtitle: "Random helpers for game setup",
        theme: "Appearance", light: "☀️ Light", dark: "🌙 Dark", contrast: "◐ Contrast", rainbow: "🌈 Rainbow" },
};

// Neue Randomizer hier eintragen
const GAMES = [
  { href: "spiele/riffwelten.html", icon: "🐠",
    de: { name: "Riffwelten", desc: "Riffbewohner, Nistzeit & Aufbau-Hinweise" },
    en: { name: "Shallow Sea", desc: "Sealife Tiles, Nesting Season & setup notes" } },
  { href: "spiele/life-of-the-amazonia.html", icon: "🐆",
    de: { name: "Life of the Amazonia", desc: "Standard-Tierkarten A–D (+ F) und Tierfiguren pro Karte" },
    en: { name: "Life of the Amazonia", desc: "Base Animal Cards A–D (+ F) and meeples per card" } },
  { href: "spiele/sushi-go-party.html", icon: "🍣",
    de: { name: "Sushi Go Party!", desc: "Zufälliges Menü für 2–8 Personen" },
    en: { name: "Sushi Go Party!", desc: "Random menu for 2–8 players" } },
  // Externer Link (öffnet in neuem Tab)
  { href: "https://seti-solarsystem.czechgames.com/", icon: "🪐", external: true,
    de: { name: "SETI", desc: "Sonnensystem-App von Czech Games" },
    en: { name: "SETI", desc: "Solar System app by Czech Games" } },
];

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let lang = store.get("lang");
if (lang !== "de" && lang !== "en") lang = (navigator.language || "de").toLowerCase().startsWith("de") ? "de" : "en";

function t(key) {
  const v = I18N[lang][key];
  if (v === undefined) { console.warn("i18n: fehlender Schlüssel", lang, key); return I18N.de[key] ?? key; }
  return v;
}

// Darstellung: gespeichert unter "theme" (gilt für alle Seiten); ohne Wahl folgt sie dem System
function currentTheme() {
  return document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}

function render() {
  document.documentElement.lang = lang;
  document.title = t("docTitle");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.querySelectorAll("#theme button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeValue === currentTheme())));
  document.getElementById("games").innerHTML = GAMES.map(g => {
    const x = g[lang] || g.de;
    const ext = g.external ? ` target="_blank" rel="noopener"` : "";
    return `<a class="game" href="${g.href}"${ext}><span class="icon" aria-hidden="true">${g.icon}</span>` +
      `<div><strong>${x.name}${g.external ? " ↗" : ""}</strong><span>${x.desc}</span></div></a>`;
  }).join("");
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; store.set("lang", lang); render();
}));
document.querySelectorAll("#theme button").forEach(b => b.addEventListener("click", () => {
  document.documentElement.dataset.theme = b.dataset.themeValue;
  store.set("theme", b.dataset.themeValue);
  render();
}));
render();
</script>
</body>
</html>
