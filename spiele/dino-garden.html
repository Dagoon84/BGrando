<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8a5a2b">
  <title>Dinosaurus Garden – Randomizer</title>
  <style>
    :root {
      --bg: #f7f3ec; --card: #ffffff; --fg: #24190f; --muted: #6e6152; --border: #e6dccd;
      --accent: #8a5a2b; --accent-fg: #ffffff; --accent-soft: #f1e4d3; --hot: #2e8b57;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15110c; --card: #211a13; --fg: #f1e9de; --muted: #ab9c89; --border: #3a2e22;
        --accent: #d79b5c; --accent-fg: #1d1208; --accent-soft: #3a2a1a; --hot: #5cc28a;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    main { max-width: 640px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    header a { color: var(--accent); text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
    .lang { display: flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--card); }
    .lang button { min-width: 48px; min-height: 44px; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; }
    .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
    h1 { font-size: 1.75rem; margin: 8px 0 16px; line-height: 1.2; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .card h2 { font-size: 1.05rem; margin: 0 0 10px; }
    .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
    .seg button {
      min-height: 52px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg);
      color: var(--fg); font: inherit; font-size: 1rem; font-weight: 700; line-height: 1.2; padding: 6px;
    }
    .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; cursor: pointer; }
    .toggle + .toggle { border-top: 1px solid var(--border); }
    .toggle input {
      appearance: none; -webkit-appearance: none; flex: none; width: 52px; height: 32px; border-radius: 999px;
      background: var(--border); position: relative; transition: background .15s; margin: 0;
    }
    .toggle input::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
      background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    .toggle input:checked { background: var(--accent); }
    .toggle input:checked::after { transform: translateX(20px); }
    .roll {
      display: block; width: 100%; margin: 12px 0 0; min-height: 60px; border: 0; border-radius: 16px;
      background: var(--hot); color: #fff; font: inherit; font-size: 1.2rem; font-weight: 700;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }
    .roll:active { transform: scale(.98); }
    .empty { color: var(--muted); text-align: center; padding: 20px 8px; }
    ul.list { list-style: none; margin: 0; padding: 0; }
    ul.list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
    ul.list li:first-child { border-top: 0; }
    .name { flex: 1; font-size: 1.15rem; font-weight: 700; min-width: 0; }
    .tag { flex: none; font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--fg); }
  </style>
</head>
<body>
<main>
  <header>
    <a href="../index.html" data-i18n="back">← Übersicht</a>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <h1>Dinosaurus Garden</h1>

  <section class="card">
    <h2 data-i18n="mode">Anzahl Besonderer-Dinosaurier-Karten</h2>
    <div class="seg" data-setting="count">
      <button type="button" data-value="3" data-i18n="standard">3 · Standard</button>
      <button type="button" data-value="6" data-i18n="advanced">6 · Fortgeschritten</button>
    </div>
    <button class="roll" id="roll" type="button" data-i18n="roll">🎲 Zufall</button>
  </section>

  <section class="card">
    <label class="toggle"><span data-i18n="ex1"></span><input type="checkbox" data-setting="ex1"></label>
    <label class="toggle"><span data-i18n="ex2"></span><input type="checkbox" data-setting="ex2"></label>
  </section>

  <div id="results" aria-live="polite"></div>
</main>

<script>
// ===== 1. Übersetzungen =====
const I18N = {
  de: {
    docTitle: "Dinosaurus Garden – Randomizer",
    back: "← Übersicht",
    mode: "Anzahl Besonderer-Dinosaurier-Karten",
    standard: "3 · Standard",
    advanced: "6 · Fortgeschritten",
    roll: "🎲 Zufall",
    ex1: "Erweiterung 1 (5 Dinosaurier)",
    ex2: "Erweiterung 2 (4 Dinosaurier)",
    cards: "Besonderer-Dinosaurier-Karten",
    set_base: "Grundspiel", set_ex1: "Erw. 1", set_ex2: "Erw. 2",
    empty: "Wähle die Anzahl Karten und tippe auf „Zufall“.",
  },
  en: {
    docTitle: "Dinosaurus Garden – Randomizer",
    back: "← Overview",
    mode: "Number of Special Dinosaur cards",
    standard: "3 · Standard",
    advanced: "6 · Advanced",
    roll: "🎲 Random",
    ex1: "Expansion 1 (5 dinosaurs)",
    ex2: "Expansion 2 (4 dinosaurs)",
    cards: "Special Dinosaur cards",
    set_base: "Base game", set_ex1: "Exp. 1", set_ex2: "Exp. 2",
    empty: "Choose the number of cards and tap “Random”.",
  },
};

// ===== 2. Spieldaten =====
// Besonderer-Dinosaurier-Karten: Grundspiel 7, Erweiterung 1: 5, Erweiterung 2: 4.
// Standard: 3 Karten, für Erfahrene bis zu 6 (Spielvorbereitung).
const DINOS = [
  { id: "spinosaurus", set: "base", de: "Spinosaurus", en: "Spinosaurus" },
  { id: "archaeopteryx", set: "base", de: "Archaeopteryx", en: "Archaeopteryx" },
  { id: "parasaurolophus", set: "base", de: "Parasaurolophus", en: "Parasaurolophus" },
  { id: "dracorex", set: "base", de: "Dracorex", en: "Dracorex" },
  { id: "sinosauropteryx", set: "base", de: "Sinosauropteryx", en: "Sinosauropteryx" },
  { id: "stegosaurus", set: "base", de: "Stegosaurus", en: "Stegosaurus" },
  { id: "amargasaurus", set: "base", de: "Amargasaurus", en: "Amargasaurus" },
  { id: "dilophosaurus", set: "ex1", de: "Dilophosaurus", en: "Dilophosaurus" },
  { id: "allosaurus", set: "ex1", de: "Allosaurus", en: "Allosaurus" },
  { id: "carnotaurus", set: "ex1", de: "Carnotaurus", en: "Carnotaurus" },
  { id: "dimetrodon", set: "ex1", de: "Dimetrodon", en: "Dimetrodon" },
  { id: "ichthyosaurus", set: "ex1", de: "Ichthyosaurus", en: "Ichthyosaurus" },
  { id: "brachiosaurus", set: "ex2", de: "Brachiosaurus", en: "Brachiosaurus" },
  { id: "fukuisaurus", set: "ex2", de: "Fukuisaurus", en: "Fukuisaurus" },
  { id: "therizinosaurus", set: "ex2", de: "Therizinosaurus", en: "Therizinosaurus" },
  { id: "ankylosaurus", set: "ex2", de: "Ankylosaurus", en: "Ankylosaurus" },
];

// ===== 3. Zufall =====
function randInt(n) {
  const max = Math.floor(0x100000000 / n) * n;
  const buf = new Uint32Array(1);
  do { crypto.getRandomValues(buf); } while (buf[0] >= max);
  return buf[0] % n;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===== 4. Sprache & Einstellungen =====
const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
  set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} },
};
let lang = store.get("lang");
if (lang !== "de" && lang !== "en") lang = (navigator.language || "de").toLowerCase().startsWith("de") ? "de" : "en";

function t(key) {
  const v = I18N[lang][key];
  if (v === undefined) { console.warn("i18n: fehlender Schlüssel", lang, key); return I18N.de[key] ?? key; }
  return v;
}

const DEFAULTS = { count: 3, ex1: false, ex2: false };
const saved = store.get("dino-settings") || {};
let settings = Object.fromEntries(Object.keys(DEFAULTS).map(k => [k, saved[k] ?? DEFAULTS[k]]));
let result = store.get("dino-result"); // { ids: [...] }
if (!result || !Array.isArray(result.ids)) result = null;

// ===== 5. Würfeln =====
function rollAll() {
  const pool = DINOS.filter(d => d.set === "base" || settings[d.set]);
  const order = DINOS.map(d => d.id);
  result = { ids: shuffle(pool).slice(0, settings.count).map(d => d.id).sort((a, b) => order.indexOf(a) - order.indexOf(b)) };
  store.set("dino-result", result);
  renderResults();
}

// ===== 6. Rendern =====
function renderResults() {
  const el = document.getElementById("results");
  if (!result) { el.innerHTML = `<div class="card empty">${t("empty")}</div>`; return; }
  el.innerHTML = `<section class="card"><h2>${t("cards")}</h2><ul class="list">` +
    result.ids.map(id => DINOS.find(d => d.id === id)).map(d =>
      `<li><span class="name">${d[lang]}</span><span class="tag">${t("set_" + d.set)}</span></li>`).join("") +
    `</ul></section>`;
}

function render() {
  document.documentElement.lang = lang;
  document.title = t("docTitle");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.querySelectorAll(".seg[data-setting=count] button").forEach(b =>
    b.setAttribute("aria-pressed", String(Number(b.dataset.value) === settings.count)));
  document.querySelectorAll("input[data-setting]").forEach(i => { i.checked = settings[i.dataset.setting]; });
  renderResults();
}

// ===== 7. Events =====
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; store.set("lang", lang); render();
}));
document.querySelector(".seg[data-setting=count]").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  settings.count = Number(b.dataset.value);
  store.set("dino-settings", settings);
  render();
});
document.querySelectorAll("input[data-setting]").forEach(i => i.addEventListener("change", () => {
  settings[i.dataset.setting] = i.checked;
  store.set("dino-settings", settings);
}));
document.getElementById("roll").addEventListener("click", rollAll);

render();
</script>
</body>
</html>
